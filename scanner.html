<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK-IN | สแกนริสต์แบนด์ TAKEOFF LIVE MUSIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #05050c;
            --card-bg: rgba(15, 15, 30, 0.9);
            --neon-blue: #00ffff;
            --neon-green: #00ff66;
            --neon-pink: #ff00ff;
            --neon-red: #ff3366;
            --neon-glow: 0 0 15px rgba(0, 255, 255, 0.4);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 10%, #0c1b33 0%, var(--bg-color) 80%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: var(--neon-glow);
            border-radius: 20px;
            padding: 25px;
        }
        h2 {
            text-align: center;
            color: var(--neon-blue);
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            font-size: 1.25rem;
        }
        .sub-header {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        #reader {
            width: 100% !important;
            border-radius: 12px;
            overflow: hidden;
            border: 2px dashed rgba(0, 240, 255, 0.4);
            background: rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        #reader video { border-radius: 10px; }
        .manual-section {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.85rem; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(5, 11, 20, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }
        input:focus { border-color: var(--neon-blue); box-shadow: var(--neon-glow); }
        button.btn-action {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: var(--neon-glow);
        }
        .status-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            display: none;
        }
        .status-box.success {
            background: rgba(0, 255, 102, 0.1);
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
        }
        .status-box.error {
            background: rgba(255, 51, 102, 0.1);
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.3);
        }
        .status-box.warning {
            background: rgba(255, 187, 0, 0.1);
            border: 2px solid #ffbb00;
            color: #ffbb00;
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }
        .stats-item span { color: var(--neon-blue); font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎟️ STAFF CHECK-IN</h2>
        <div class="sub-header">สแกน QR Code หรือพิมพ์รหัสบัตรหน้างาน</div>

        <!-- กล้องสแกน -->
        <div id="reader"></div>

        <!-- กรอกรหัสเองกรณีกล้องมีปัญหา -->
        <div class="manual-section">
            <div class="form-group">
                <label>รหัสตั๋ว / Booking ID (พิมพ์หรือยิงบาร์โค้ด)</label>
                <input type="text" id="manualCode" placeholder="เช่น TICKET-1234 หรือ TICKET-1234-1" onkeypress="checkEnter(event)">
            </div>
            <button type="button" class="btn-action" onclick="processCheckIn(document.getElementById('manualCode').value)">✅ ยืนยันเช็คอิน</button>
        </div>

        <!-- กล่องแสดงผลลัพธ์การสแกน -->
        <div id="statusResult" class="status-box">
            <h3 id="resTitle" style="font-size: 1.2rem; margin-bottom: 8px;">-</h3>
            <p id="resDetail" style="font-size: 0.95rem; color: #fff; line-height: 1.5;"></p>
        </div>
    </div>

    <script>
        // เปลี่ยนเป็น Web App URL ของหลังบ้านคุณ
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmiWKohvrD52Ye9hRRAx1LdZf10JdllFAmKA2IDtNQFNeywu0XlbIJLvfQeMeucaDSzA/exec";
        let isProcessing = false;

        function checkEnter(e) {
            if (e.key === 'Enter') {
                processCheckIn(document.getElementById('manualCode').value);
            }
        }

        async function processCheckIn(rawCode) {
            if (!rawCode || isProcessing) return;
            rawCode = rawCode.trim();
            if (!rawCode) return;

            isProcessing = true;
            document.getElementById('manualCode').value = '';
            showStatus('warning', '⏳ กำลังตรวจสอบสิทธิ์...', 'กรุณารอสักครู่...');

            // แกะข้อความจาก QR หากสแกนมาจากข้อความยาว "TICKET: X | Name: Y | ..."
            let targetTicketCode = rawCode;
            if (rawCode.includes("TICKET:")) {
                const match = rawCode.match(/TICKET:\s*([^\s|]+)/);
                if (match && match[1]) targetTicketCode = match[1];
            }

            try {
                // ส่ง request เช็คอินไปที่ GAS หลังบ้าน (action: checkInTicket)
                const payload = {
                    action: "checkInTicket",
                    ticketCode: targetTicketCode,
                    timestamp: new Date().toISOString()
                };

                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.status === "success") {
                    showStatus('success', '🎉 ผ่าน! แลกริสต์แบนด์ได้', `รหัส: ${result.ticketCode || targetTicketCode}<br>ชื่อ: ${result.name || '-'}<br>โซน: ${result.tableNo || '-'}`);
                } else if (result.status === "already") {
                    showStatus('warning', '⚠️ เช็คอินซ้ำแล้ว!', `รหัสนี้ถูกใช้งานไปแล้วเมื่อ:<br>${result.checkedTime || 'ก่อนหน้านี้'}`);
                } else {
                    showStatus('error', '❌ ไม่พบข้อมูลบัตร / ไม่ถูกต้อง', `รหัส "${targetTicketCode}" ไม่พบในระบบ หรือยังไม่ชำระเงิน`);
                }
            } catch (err) {
                showStatus('error', '❌ เกิดข้อผิดพลาดเชื่อมต่อ', 'กรุณาลองใหม่อีกครั้ง');
            } finally {
                isProcessing = false;
            }
        }

        function showStatus(type, title, detail) {
            const box = document.getElementById('statusResult');
            box.className = 'status-box ' + type;
            box.style.display = 'block';
            document.getElementById('resTitle').textContent = title;
            document.getElementById('resDetail').innerHTML = detail;
        }

        // เริ่มต้นกล้อง Html5Qrcode
        function startScanner() {
            const html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 220, height: 220 } };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText, decodedResult) => {
                    // สแกนเจอ QR แล้วส่งไปเช็คอินทันที
                    processCheckIn(decodedText);
                },
                (errorMessage) => {
                    // กำลังสแกนหา... (ปล่อยว่างไว้ไม่ให้รก log)
                }
            ).catch(err => {
                console.log("Camera start warning/error: ", err);
            });
        }

        window.addEventListener('load', startScanner);
    </script>
</body>
</html>
